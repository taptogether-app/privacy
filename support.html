<title>Tap Together Support</title>
<style>
/* Layout: one readable column, logo header in the game's colours, numbered sections as in the app */
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#2B1D10; --muted:#7A5A32; --accent:#D85A30; --green:#1D9E75; --line:#F1E3CC; --chip:#FDEBD3;
  --display:ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,sans-serif; --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1C1712;--card:#27201A;--ink:#F5EBDD;--muted:#C9AE8A;--accent:#F08A5D;--green:#3CC79C;--line:#3A2F25;--chip:#3A2C20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1712;--card:#27201A;--ink:#F5EBDD;--muted:#C9AE8A;--accent:#F08A5D;--green:#3CC79C;--line:#3A2F25;--chip:#3A2C20;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.upd{color:var(--muted);font-size:14px;margin:6px 0 0}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 8px}
.langs button{font:600 13px/1 var(--body);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.langs button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
main{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 22px 14px;margin-top:14px}
section{padding-block:14px;border-bottom:1px solid var(--line)}
section:last-child{border-bottom:0}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 4px;color:var(--accent)}
p{margin:0;max-width:65ch}
.owner{margin-top:8px;padding:12px 14px;background:var(--chip);border-radius:12px;font-size:15px;direction:ltr;text-align:left}
.owner b{font-weight:800} .owner a{color:inherit}
footer{color:var(--muted);font-size:13px;margin-top:18px;text-align:center}
[dir="rtl"] .owner{text-align:left}
@media (prefers-reduced-motion:no-preference){.langs button{transition:background .15s}}
.qa h2{font-size:17px}
.mail{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:9px 16px}
.links{margin-top:14px;text-align:center}
.links a{color:var(--accent);font-weight:700}
</style>
</head>

<script>
var S={"English": {"title": "Tap Together - Support", "updated": "Last updated: 30 October 2026", "intro": "Answers to common questions from parents. If you need help, write to us.", "q1": "How can I contact you?", "a1": "Write to taptogether.help@gmail.com or use Settings → Feedback in the game (after the parent check). We answer as soon as we can.", "q2": "How do I get my purchases back on a new phone?", "a2": "Sign in with the same App Store or Google Play account, open Settings → Restore purchases. Purchases cannot be moved between iPhone and Android.", "q3": "How do I cancel a Pass or ask for a refund?", "a3": "A Pass renews every year until you cancel it. iPhone: Settings → your name → Subscriptions. Android: Google Play → profile picture → Payments and subscriptions → Subscriptions. Refunds are handled by Apple or Google.", "q4": "My child keeps leaving the game. What can I do?", "a4": "Turn on Child lock in Settings. On Android the app is pinned to the screen. On iPhone the game shows how to use Guided Access. You can also lock the player button at the bottom with the small lock.", "q5": "Where are the parent settings?", "a5": "Tap the gear on the home screen and answer the parent question. There you can change the language, sounds, break reminder, Child lock, purchases and feedback.", "q6": "How do I delete our data?", "a6": "To remove one player, open Edit player → Remove. To remove everything, delete the app. A backup copy in your own iCloud or Google account can be deleted in the phone settings.", "q7": "Does the game collect personal data?", "a7": "No. Everything stays on your device, there are no ads and no tracking. Details are in the privacy policy.", "mail": "Email us", "privacy": "Privacy policy"}, "French": {"title": "Tap Together - Assistance", "updated": "Dernière mise à jour : 30 octobre 2026", "intro": "Réponses aux questions fréquentes des parents. Si vous avez besoin d’aide, écrivez-nous.", "q1": "Comment vous contacter ?", "a1": "Écrivez à taptogether.help@gmail.com ou utilisez Réglages → Commentaires dans le jeu (après le contrôle parental). Nous répondons dès que possible.", "q2": "Comment récupérer mes achats sur un nouveau téléphone ?", "a2": "Connectez-vous avec le même compte App Store ou Google Play, puis ouvrez Réglages → Restaurer les achats. Les achats ne passent pas d’un iPhone à Android ni l’inverse.", "q3": "Comment annuler un Pass ou demander un remboursement ?", "a3": "Un Pass se renouvelle chaque année jusqu’à ce que vous l’annuliez. iPhone : Réglages → votre nom → Abonnements. Android : Google Play → photo de profil → Paiements et abonnements → Abonnements. Les remboursements sont gérés par Apple ou Google.", "q4": "Mon enfant quitte sans cesse le jeu. Que faire ?", "a4": "Activez le Verrou enfant dans les Réglages. Sur Android, l’application est épinglée à l’écran. Sur iPhone, le jeu explique comment utiliser l’Accès guidé. Vous pouvez aussi verrouiller le bouton du joueur en bas avec le petit cadenas.", "q5": "Où sont les réglages pour les parents ?", "a5": "Touchez la roue dentée sur l’écran d’accueil et répondez à la question pour les parents. Vous pouvez y changer la langue, les sons, le rappel de pause, le Verrou enfant, les achats et les commentaires.", "q6": "Comment supprimer nos données ?", "a6": "Pour supprimer un joueur, ouvrez Modifier le joueur → Supprimer. Pour tout supprimer, désinstallez l’application. Une copie de sauvegarde dans votre compte iCloud ou Google peut être supprimée dans les réglages du téléphone.", "q7": "Le jeu collecte-t-il des données personnelles ?", "a7": "Non. Tout reste sur votre appareil, sans publicité ni suivi. Les détails sont dans la politique de confidentialité.", "mail": "Nous écrire", "privacy": "Politique de confidentialité"}, "German": {"title": "Tap Together - Hilfe", "updated": "Zuletzt aktualisiert: 30. Oktober 2026", "intro": "Antworten auf häufige Fragen von Eltern. Wenn du Hilfe brauchst, schreib uns.", "q1": "Wie kann ich euch erreichen?", "a1": "Schreib an taptogether.help@gmail.com oder nutze im Spiel Einstellungen → Feedback (nach der Elternprüfung). Wir antworten so schnell wie möglich.", "q2": "Wie bekomme ich meine Käufe auf einem neuen Handy zurück?", "a2": "Melde dich mit demselben App-Store- oder Google-Play-Konto an und öffne Einstellungen → Käufe wiederherstellen. Käufe lassen sich nicht zwischen iPhone und Android übertragen.", "q3": "Wie kündige ich einen Pass oder bekomme eine Erstattung?", "a3": "Ein Pass verlängert sich jedes Jahr, bis du ihn kündigst. iPhone: Einstellungen → dein Name → Abonnements. Android: Google Play → Profilbild → Zahlungen und Abos → Abos. Erstattungen laufen über Apple oder Google.", "q4": "Mein Kind verlässt immer wieder das Spiel. Was tun?", "a4": "Schalte in den Einstellungen die Kindersperre ein. Auf Android wird die App angeheftet. Auf dem iPhone zeigt das Spiel, wie der Geführte Zugriff funktioniert. Mit dem kleinen Schloss unten kannst du außerdem den Spieler-Knopf sperren.", "q5": "Wo sind die Einstellungen für Eltern?", "a5": "Tippe auf dem Startbildschirm auf das Zahnrad und beantworte die Elternfrage. Dort kannst du Sprache, Töne, Pausenerinnerung, Kindersperre, Käufe und Feedback ändern.", "q6": "Wie lösche ich unsere Daten?", "a6": "Einen Spieler entfernst du unter Spieler bearbeiten → Entfernen. Um alles zu löschen, lösche die App. Eine Sicherung in deinem eigenen iCloud- oder Google-Konto kannst du in den Handy-Einstellungen löschen.", "q7": "Sammelt das Spiel persönliche Daten?", "a7": "Nein. Alles bleibt auf deinem Gerät, es gibt keine Werbung und kein Tracking. Details stehen in der Datenschutzerklärung.", "mail": "Schreib uns", "privacy": "Datenschutzerklärung"}, "Spanish": {"title": "Tap Together - Ayuda", "updated": "Última actualización: 30 de octubre de 2026", "intro": "Respuestas a preguntas frecuentes de padres. Si necesitas ayuda, escríbenos.", "q1": "¿Cómo puedo contactaros?", "a1": "Escribe a taptogether.help@gmail.com o usa Ajustes → Comentarios en el juego (después de la comprobación parental). Respondemos lo antes posible.", "q2": "¿Cómo recupero mis compras en un teléfono nuevo?", "a2": "Inicia sesión con la misma cuenta de App Store o Google Play y abre Ajustes → Restaurar compras. Las compras no se pueden pasar entre iPhone y Android.", "q3": "¿Cómo cancelo un Pase o pido un reembolso?", "a3": "Un Pase se renueva cada año hasta que lo canceles. iPhone: Ajustes → tu nombre → Suscripciones. Android: Google Play → foto de perfil → Pagos y suscripciones → Suscripciones. Los reembolsos los gestionan Apple o Google.", "q4": "Mi hijo sale del juego todo el rato. ¿Qué hago?", "a4": "Activa el Bloqueo infantil en Ajustes. En Android la app se fija en la pantalla. En iPhone el juego explica cómo usar el Acceso guiado. También puedes bloquear el botón del jugador abajo con el pequeño candado.", "q5": "¿Dónde están los ajustes para padres?", "a5": "Toca el engranaje en la pantalla de inicio y responde la pregunta para padres. Allí puedes cambiar el idioma, los sonidos, el aviso de descanso, el Bloqueo infantil, las compras y los comentarios.", "q6": "¿Cómo borro nuestros datos?", "a6": "Para quitar un jugador, abre Editar jugador → Eliminar. Para borrarlo todo, elimina la app. Una copia de seguridad en tu propia cuenta de iCloud o Google se puede borrar en los ajustes del teléfono.", "q7": "¿El juego recopila datos personales?", "a7": "No. Todo se queda en tu dispositivo, sin anuncios ni seguimiento. Los detalles están en la política de privacidad.", "mail": "Escríbenos", "privacy": "Política de privacidad"}, "Russian": {"title": "Tap Together - Поддержка", "updated": "Последнее обновление: 30 октября 2026 г.", "intro": "Ответы на частые вопросы родителей. Если нужна помощь, напишите нам.", "q1": "Как с вами связаться?", "a1": "Напишите на taptogether.help@gmail.com или используйте в игре Настройки → Отзыв (после проверки для родителей). Мы ответим как можно скорее.", "q2": "Как вернуть покупки на новом телефоне?", "a2": "Войдите с тем же аккаунтом App Store или Google Play и откройте Настройки → Восстановить покупки. Покупки нельзя перенести между iPhone и Android.", "q3": "Как отменить Пропуск или вернуть деньги?", "a3": "Пропуск продлевается каждый год, пока вы его не отмените. iPhone: Настройки → ваше имя → Подписки. Android: Google Play → фото профиля → Платежи и подписки → Подписки. Возвратом денег занимаются Apple или Google.", "q4": "Ребёнок всё время выходит из игры. Что делать?", "a4": "Включите Замок для ребёнка в Настройках. На Android приложение закрепляется на экране. На iPhone игра покажет, как включить Гид-доступ. Ещё можно заблокировать кнопку игрока внизу маленьким замком.", "q5": "Где настройки для родителей?", "a5": "Нажмите на шестерёнку на главном экране и ответьте на вопрос для родителей. Там можно изменить язык, звуки, напоминание о перерыве, Замок для ребёнка, покупки и отзыв.", "q6": "Как удалить наши данные?", "a6": "Чтобы удалить игрока, откройте Редактировать игрока → Удалить. Чтобы удалить всё, удалите приложение. Резервную копию в вашем аккаунте iCloud или Google можно удалить в настройках телефона.", "q7": "Собирает ли игра личные данные?", "a7": "Нет. Всё остаётся на вашем устройстве, нет рекламы и отслеживания. Подробности в политике конфиденциальности.", "mail": "Написать нам", "privacy": "Политика конфиденциальности"}, "Ukrainian": {"title": "Tap Together - Підтримка", "updated": "Останнє оновлення: 30 жовтня 2026 р.", "intro": "Відповіді на часті питання батьків. Якщо потрібна допомога, напишіть нам.", "q1": "Як з вами зв’язатися?", "a1": "Напишіть на taptogether.help@gmail.com або скористайтеся в грі Налаштування → Відгук (після перевірки для батьків). Ми відповімо якнайшвидше.", "q2": "Як повернути покупки на новому телефоні?", "a2": "Увійдіть з тим самим акаунтом App Store або Google Play і відкрийте Налаштування → Відновити покупки. Покупки не переносяться між iPhone і Android.", "q3": "Як скасувати Пропуск або повернути гроші?", "a3": "Пропуск подовжується щороку, доки ви його не скасуєте. iPhone: Параметри → ваше ім’я → Підписки. Android: Google Play → фото профілю → Платежі й підписки → Підписки. Поверненням коштів займаються Apple або Google.", "q4": "Дитина весь час виходить з гри. Що робити?", "a4": "Увімкніть Замок для дитини в Налаштуваннях. На Android застосунок закріплюється на екрані. На iPhone гра покаже, як увімкнути Гід-доступ. Ще можна заблокувати кнопку гравця внизу маленьким замочком.", "q5": "Де налаштування для батьків?", "a5": "Натисніть на шестерню на головному екрані й дайте відповідь на питання для батьків. Там можна змінити мову, звуки, нагадування про перерву, Замок для дитини, покупки й відгук.", "q6": "Як видалити наші дані?", "a6": "Щоб видалити гравця, відкрийте Редагувати гравця → Видалити. Щоб видалити все, видаліть застосунок. Резервну копію у вашому акаунті iCloud або Google можна видалити в налаштуваннях телефона.", "q7": "Чи збирає гра особисті дані?", "a7": "Ні. Усе лишається на вашому пристрої, немає реклами й відстеження. Подробиці в політиці конфіденційності.", "mail": "Написати нам", "privacy": "Політика конфіденційності"}, "Slovak": {"title": "Tap Together - Podpora", "updated": "Posledná aktualizácia: 30. októbra 2026", "intro": "Odpovede na časté otázky rodičov. Ak potrebujete pomoc, napíšte nám.", "q1": "Ako vás môžem kontaktovať?", "a1": "Napíšte na taptogether.help@gmail.com alebo v hre použite Nastavenia → Spätná väzba (po rodičovskej kontrole). Odpovieme čo najskôr.", "q2": "Ako získam nákupy späť na novom telefóne?", "a2": "Prihláste sa rovnakým účtom App Store alebo Google Play a otvorte Nastavenia → Obnoviť nákupy. Nákupy sa nedajú presunúť medzi iPhonom a Androidom.", "q3": "Ako zruším Pass alebo požiadam o vrátenie peňazí?", "a3": "Pass sa obnovuje každý rok, kým ho nezrušíte. iPhone: Nastavenia → vaše meno → Predplatné. Android: Google Play → profilová fotka → Platby a predplatné → Predplatné. Vrátenie peňazí rieši Apple alebo Google.", "q4": "Dieťa stále odchádza z hry. Čo s tým?", "a4": "Zapnite Detský zámok v Nastaveniach. Na Androide sa aplikácia pripne na obrazovku. Na iPhone hra ukáže, ako použiť Asistovaný prístup. Tlačidlo hráča dole môžete zamknúť aj malým zámkom.", "q5": "Kde sú nastavenia pre rodičov?", "a5": "Ťuknite na ozubené koliesko na úvodnej obrazovke a odpovedzte na otázku pre rodičov. Tam môžete zmeniť jazyk, zvuky, pripomienku prestávky, Detský zámok, nákupy a spätnú väzbu.", "q6": "Ako vymažem naše údaje?", "a6": "Hráča odstránite cez Upraviť hráča → Odstrániť. Ak chcete vymazať všetko, odinštalujte aplikáciu. Záložnú kópiu vo vašom účte iCloud alebo Google vymažete v nastaveniach telefónu.", "q7": "Zbiera hra osobné údaje?", "a7": "Nie. Všetko zostáva vo vašom zariadení, bez reklám a sledovania. Podrobnosti sú v zásadách ochrany súkromia.", "mail": "Napíšte nám", "privacy": "Zásady ochrany súkromia"}, "Polish": {"title": "Tap Together - Pomoc", "updated": "Ostatnia aktualizacja: 30 października 2026", "intro": "Odpowiedzi na częste pytania rodziców. Jeśli potrzebujesz pomocy, napisz do nas.", "q1": "Jak mogę się z wami skontaktować?", "a1": "Napisz na taptogether.help@gmail.com lub użyj w grze Ustawienia → Opinia (po kontroli rodzicielskiej). Odpowiemy tak szybko, jak to możliwe.", "q2": "Jak odzyskać zakupy na nowym telefonie?", "a2": "Zaloguj się tym samym kontem App Store lub Google Play i otwórz Ustawienia → Przywróć zakupy. Zakupów nie da się przenieść między iPhone’em a Androidem.", "q3": "Jak anulować Karnet lub poprosić o zwrot pieniędzy?", "a3": "Karnet odnawia się co roku, dopóki go nie anulujesz. iPhone: Ustawienia → twoje imię → Subskrypcje. Android: Google Play → zdjęcie profilowe → Płatności i subskrypcje → Subskrypcje. Zwrotami zajmuje się Apple lub Google.", "q4": "Dziecko ciągle wychodzi z gry. Co zrobić?", "a4": "Włącz Blokadę dziecięcą w Ustawieniach. Na Androidzie aplikacja zostaje przypięta do ekranu. Na iPhonie gra pokaże, jak użyć Dostępu nadzorowanego. Możesz też zablokować przycisk gracza na dole małą kłódką.", "q5": "Gdzie są ustawienia dla rodziców?", "a5": "Dotknij koła zębatego na ekranie głównym i odpowiedz na pytanie dla rodziców. Możesz tam zmienić język, dźwięki, przypomnienie o przerwie, Blokadę dziecięcą, zakupy i opinię.", "q6": "Jak usunąć nasze dane?", "a6": "Aby usunąć gracza, otwórz Edytuj gracza → Usuń. Aby usunąć wszystko, odinstaluj aplikację. Kopię zapasową na twoim koncie iCloud lub Google usuniesz w ustawieniach telefonu.", "q7": "Czy gra zbiera dane osobowe?", "a7": "Nie. Wszystko zostaje na twoim urządzeniu, bez reklam i śledzenia. Szczegóły są w polityce prywatności.", "mail": "Napisz do nas", "privacy": "Polityka prywatności"}, "Italian": {"title": "Tap Together - Assistenza", "updated": "Ultimo aggiornamento: 30 ottobre 2026", "intro": "Risposte alle domande frequenti dei genitori. Se ti serve aiuto, scrivici.", "q1": "Come posso contattarvi?", "a1": "Scrivi a taptogether.help@gmail.com oppure usa Impostazioni → Feedback nel gioco (dopo il controllo per i genitori). Rispondiamo appena possibile.", "q2": "Come recupero i miei acquisti su un nuovo telefono?", "a2": "Accedi con lo stesso account App Store o Google Play e apri Impostazioni → Ripristina acquisti. Gli acquisti non possono essere spostati tra iPhone e Android.", "q3": "Come annullo un Pass o chiedo un rimborso?", "a3": "Un Pass si rinnova ogni anno finché non lo annulli. iPhone: Impostazioni → il tuo nome → Abbonamenti. Android: Google Play → foto del profilo → Pagamenti e abbonamenti → Abbonamenti. I rimborsi sono gestiti da Apple o Google.", "q4": "Mio figlio esce sempre dal gioco. Cosa posso fare?", "a4": "Attiva il Blocco bambini nelle Impostazioni. Su Android l’app viene bloccata sullo schermo. Su iPhone il gioco spiega come usare Accesso guidato. Puoi anche bloccare il pulsante del giocatore in basso con il piccolo lucchetto.", "q5": "Dove sono le impostazioni per i genitori?", "a5": "Tocca l’ingranaggio nella schermata iniziale e rispondi alla domanda per i genitori. Lì puoi cambiare lingua, suoni, promemoria pausa, Blocco bambini, acquisti e feedback.", "q6": "Come elimino i nostri dati?", "a6": "Per rimuovere un giocatore, apri Modifica giocatore → Rimuovi. Per eliminare tutto, elimina l’app. Una copia di backup nel tuo account iCloud o Google si può eliminare nelle impostazioni del telefono.", "q7": "Il gioco raccoglie dati personali?", "a7": "No. Tutto resta sul tuo dispositivo, senza pubblicità né tracciamento. I dettagli sono nell’informativa sulla privacy.", "mail": "Scrivici", "privacy": "Informativa sulla privacy"}, "Chinese": {"title": "Tap Together - 帮助", "updated": "最后更新：2026年10月30日", "intro": "家长常见问题解答。如需帮助，请给我们写信。", "q1": "怎样联系你们？", "a1": "请发邮件到 taptogether.help@gmail.com，或在游戏中通过家长验证后使用 设置 → 反馈。我们会尽快回复。", "q2": "换了新手机，怎样找回购买的内容？", "a2": "登录同一个 App Store 或 Google Play 账户，打开 设置 → 恢复购买。购买内容不能在 iPhone 和 Android 之间转移。", "q3": "怎样取消通行证或申请退款？", "a3": "通行证每年自动续订，直到你取消为止。iPhone：设置 → 你的名字 → 订阅。Android：Google Play → 头像 → 付款和订阅 → 订阅。退款由 Apple 或 Google 处理。", "q4": "孩子总是退出游戏，怎么办？", "a4": "在设置中打开儿童锁。在 Android 上应用会被固定在屏幕上。在 iPhone 上，游戏会说明如何使用引导式访问。你还可以用底部的小锁锁定玩家按钮。", "q5": "家长设置在哪里？", "a5": "点主屏幕上的齿轮，回答家长问题。在那里可以更改语言、声音、休息提醒、儿童锁、购买和反馈。", "q6": "怎样删除我们的数据？", "a6": "要删除一位玩家，打开 编辑玩家 → 删除。要删除全部内容，请删除应用。保存在你自己 iCloud 或 Google 账户中的备份可以在手机设置中删除。", "q7": "游戏会收集个人数据吗？", "a7": "不会。所有内容都保存在你的设备上，没有广告，也没有跟踪。详情见隐私政策。", "mail": "给我们写信", "privacy": "隐私政策"}, "Japanese": {"title": "Tap Together - サポート", "updated": "最終更新日：2026年10月30日", "intro": "保護者の方からよくある質問への回答です。お困りのときはご連絡ください。", "q1": "連絡するにはどうすればいいですか？", "a1": "taptogether.help@gmail.com にメールするか、ゲーム内の 設定 → フィードバック（保護者チェックのあと）をご利用ください。できるだけ早くお返事します。", "q2": "新しいスマホで購入したものを戻すには？", "a2": "同じ App Store または Google Play のアカウントでサインインし、設定 → 購入を復元 を開いてください。購入は iPhone と Android の間で移せません。", "q3": "パスの解約や返金はどうすればいいですか？", "a3": "パスは解約するまで毎年更新されます。iPhone：設定 → ご自分の名前 → サブスクリプション。Android：Google Play → プロフィール写真 → お支払いと定期購入 → 定期購入。返金は Apple または Google が対応します。", "q4": "子どもがすぐにゲームを出てしまいます。", "a4": "設定でチャイルドロックをオンにしてください。Android ではアプリが画面に固定されます。iPhone ではアクセスガイドの使い方をゲームが表示します。下の小さなかぎでプレイヤーボタンをロックすることもできます。", "q5": "保護者向けの設定はどこですか？", "a5": "ホーム画面の歯車をタップし、保護者向けの質問に答えてください。言語、音、休けいのお知らせ、チャイルドロック、購入、フィードバックを変更できます。", "q6": "データを削除するには？", "a6": "プレイヤーを消すには、プレイヤーを編集 → 削除 を開きます。すべて消すにはアプリを削除してください。ご自分の iCloud または Google アカウントのバックアップは、スマホの設定で削除できます。", "q7": "ゲームは個人情報を集めますか？", "a7": "いいえ。すべて端末の中に保存され、広告も追跡もありません。詳しくはプライバシーポリシーをご覧ください。", "mail": "メールする", "privacy": "プライバシーポリシー"}, "Hindi": {"title": "Tap Together - सहायता", "updated": "आख़िरी अपडेट: 30 अक्टूबर 2026", "intro": "माता-पिता के आम सवालों के जवाब। मदद चाहिए तो हमें लिखें।", "q1": "आपसे कैसे संपर्क करें?", "a1": "taptogether.help@gmail.com पर लिखें या खेल में सेटिंग्स → फ़ीडबैक इस्तेमाल करें (माता-पिता की जाँच के बाद)। हम जल्द से जल्द जवाब देते हैं।", "q2": "नए फ़ोन पर अपनी ख़रीदारी वापस कैसे पाएँ?", "a2": "उसी App Store या Google Play खाते से साइन इन करें और सेटिंग्स → ख़रीदारी वापस लाएँ खोलें। ख़रीदारी iPhone और Android के बीच नहीं जा सकती।", "q3": "पास कैसे रद्द करें या पैसे वापस कैसे माँगें?", "a3": "पास हर साल अपने आप नया होता है, जब तक आप उसे रद्द न करें। iPhone: सेटिंग्स → आपका नाम → सब्सक्रिप्शन। Android: Google Play → प्रोफ़ाइल फ़ोटो → भुगतान और सदस्यताएँ → सदस्यताएँ। पैसे वापसी Apple या Google करते हैं।", "q4": "मेरा बच्चा बार-बार खेल से बाहर चला जाता है। क्या करें?", "a4": "सेटिंग्स में बच्चों का लॉक चालू करें। Android पर ऐप स्क्रीन पर पिन हो जाता है। iPhone पर खेल गाइडेड ऐक्सेस इस्तेमाल करने का तरीका बताता है। आप नीचे छोटे ताले से खिलाड़ी बटन भी लॉक कर सकते हैं।", "q5": "माता-पिता की सेटिंग्स कहाँ हैं?", "a5": "होम स्क्रीन पर गियर पर टैप करें और माता-पिता वाले सवाल का जवाब दें। वहाँ आप भाषा, आवाज़ें, ब्रेक रिमाइंडर, बच्चों का लॉक, ख़रीदारी और फ़ीडबैक बदल सकते हैं।", "q6": "अपना डेटा कैसे मिटाएँ?", "a6": "किसी खिलाड़ी को हटाने के लिए खिलाड़ी बदलें → हटाएँ खोलें। सब कुछ मिटाने के लिए ऐप हटा दें। आपके अपने iCloud या Google खाते में रखी बैकअप कॉपी फ़ोन की सेटिंग्स में मिटाई जा सकती है।", "q7": "क्या खेल निजी डेटा इकट्ठा करता है?", "a7": "नहीं। सब कुछ आपके डिवाइस पर ही रहता है, न विज्ञापन हैं, न ट्रैकिंग। पूरी जानकारी गोपनीयता नीति में है।", "mail": "हमें लिखें", "privacy": "गोपनीयता नीति"}, "Arabic": {"title": "Tap Together - الدعم", "updated": "آخر تحديث: 30 أكتوبر 2026", "intro": "إجابات عن الأسئلة الشائعة من الوالدين. إذا احتجت إلى مساعدة، فاكتب إلينا.", "q1": "كيف يمكنني التواصل معكم؟", "a1": "اكتب إلى taptogether.help@gmail.com أو استخدم في اللعبة الإعدادات ← ملاحظات (بعد التحقق الأبوي). نرد في أقرب وقت ممكن.", "q2": "كيف أستعيد مشترياتي على هاتف جديد؟", "a2": "سجّل الدخول بحساب App Store أو Google Play نفسه، ثم افتح الإعدادات ← استعادة المشتريات. لا يمكن نقل المشتريات بين iPhone وAndroid.", "q3": "كيف ألغي الاشتراك أو أطلب استرداد المبلغ؟", "a3": "يتجدد الاشتراك كل عام حتى تلغيه. iPhone: الإعدادات ← اسمك ← الاشتراكات. Android: Google Play ← صورة الملف الشخصي ← الدفعات والاشتراكات ← الاشتراكات. تتولى Apple أو Google استرداد المبالغ.", "q4": "طفلي يخرج من اللعبة باستمرار. ماذا أفعل؟", "a4": "فعّل قفل الأطفال في الإعدادات. على Android يُثبَّت التطبيق على الشاشة. على iPhone تشرح اللعبة كيفية استخدام الوصول الموجّه. ويمكنك أيضًا قفل زر اللاعب في الأسفل بالقفل الصغير.", "q5": "أين إعدادات الوالدين؟", "a5": "اضغط على الترس في الشاشة الرئيسية وأجب عن سؤال الوالدين. هناك يمكنك تغيير اللغة والأصوات وتذكير الاستراحة وقفل الأطفال والمشتريات والملاحظات.", "q6": "كيف أحذف بياناتنا؟", "a6": "لحذف لاعب، افتح تعديل اللاعب ← إزالة. لحذف كل شيء، احذف التطبيق. ويمكن حذف النسخة الاحتياطية في حسابك على iCloud أو Google من إعدادات الهاتف.", "q7": "هل تجمع اللعبة بيانات شخصية؟", "a7": "لا. يبقى كل شيء على جهازك، بلا إعلانات ولا تتبع. التفاصيل في سياسة الخصوصية.", "mail": "راسلنا", "privacy": "سياسة الخصوصية"}, "Hebrew": {"title": "Tap Together - תמיכה", "updated": "עדכון אחרון: 30 באוקטובר 2026", "intro": "תשובות לשאלות נפוצות של הורים. אם צריך עזרה, כתבו לנו.", "q1": "איך אפשר ליצור איתכם קשר?", "a1": "כתבו אל taptogether.help@gmail.com או השתמשו במשחק בהגדרות ← משוב (אחרי בדיקת ההורים). נענה בהקדם האפשרי.", "q2": "איך מחזירים את הרכישות בטלפון חדש?", "a2": "התחברו עם אותו חשבון App Store או Google Play ופתחו הגדרות ← שחזור רכישות. אי אפשר להעביר רכישות בין iPhone ל-Android.", "q3": "איך מבטלים מינוי או מבקשים החזר?", "a3": "מינוי מתחדש כל שנה עד שתבטלו אותו. iPhone: הגדרות ← השם שלכם ← מינויים. Android: ‏Google Play ← תמונת הפרופיל ← תשלומים ומינויים ← מינויים. את ההחזרים מטפלות Apple או Google.", "q4": "הילד יוצא מהמשחק כל הזמן. מה לעשות?", "a4": "הפעילו נעילת ילדים בהגדרות. ב-Android האפליקציה מוצמדת למסך. ב-iPhone המשחק מסביר איך להשתמש בגישה מודרכת. אפשר גם לנעול את כפתור השחקן למטה עם המנעול הקטן.", "q5": "איפה ההגדרות להורים?", "a5": "הקישו על גלגל השיניים במסך הבית וענו על השאלה להורים. שם אפשר לשנות שפה, צלילים, תזכורת להפסקה, נעילת ילדים, רכישות ומשוב.", "q6": "איך מוחקים את המידע שלנו?", "a6": "כדי להסיר שחקן, פתחו עריכת שחקן ← הסרה. כדי למחוק הכול, מחקו את האפליקציה. גיבוי בחשבון iCloud או Google שלכם אפשר למחוק בהגדרות הטלפון.", "q7": "האם המשחק אוסף מידע אישי?", "a7": "לא. הכול נשאר במכשיר שלכם, בלי פרסומות ובלי מעקב. הפרטים במדיניות הפרטיות.", "mail": "כתבו לנו", "privacy": "מדיניות פרטיות"}};
var NATIVE={"English": "English", "French": "Français", "German": "Deutsch", "Spanish": "Español", "Russian": "Русский", "Ukrainian": "Українська", "Slovak": "Slovenčina", "Polish": "Polski", "Italian": "Italiano", "Chinese": "中文", "Japanese": "日本語", "Hindi": "हिन्दी", "Arabic": "العربية", "Hebrew": "עברית"};
var CODES={"English": "en", "French": "fr", "German": "de", "Spanish": "es", "Russian": "ru", "Ukrainian": "uk", "Slovak": "sk", "Polish": "pl", "Italian": "it", "Chinese": "zh", "Japanese": "ja", "Hindi": "hi", "Arabic": "ar", "Hebrew": "he"};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function show(L){
  var T=S[L]||S.English, rtl=(L==='Arabic'||L==='Hebrew');
  document.getElementById('root').setAttribute('dir',rtl?'rtl':'ltr');
  document.documentElement.lang=CODES[L]||'en';
  document.getElementById('t').textContent=T.title; document.title=T.title;
  document.getElementById('u').textContent=T.updated;
  var h='<section><p>'+esc(T.intro)+'</p><a class="mail" href="mailto:taptogether.help@gmail.com?subject=Tap%20Together">'+esc(T.mail)+': taptogether.help@gmail.com</a></section>';
  for(var i=1;i<=7;i++) h+='<section class="qa"><h2>'+esc(T['q'+i])+'</h2><p>'+esc(T['a'+i])+'</p></section>';
  document.getElementById('m').innerHTML=h;
  var pl=document.getElementById('pl'); pl.textContent=T.privacy; pl.href='./#'+(CODES[L]||'en');
  [].forEach.call(document.querySelectorAll('#langs button'),function(b){b.setAttribute('aria-pressed',b.dataset.l===L?'true':'false');});
  try{localStorage.setItem('ppLang',L);}catch(e){}
  if(history.replaceState) try{history.replaceState(null,'','#'+(CODES[L]||'en'));}catch(e){}
}
var nav=document.getElementById('langs');
Object.keys(S).forEach(function(L){var b=document.createElement('button');b.type='button';b.dataset.l=L;b.textContent=NATIVE[L]||L;b.onclick=function(){show(L);};nav.appendChild(b);});
var start='English'; try{var s=localStorage.getItem('ppLang'); if(s&&S[s]) start=s;}catch(e){}
var codes={}; Object.keys(CODES).forEach(function(L){codes[CODES[L]]=L;}); var hash=(location.hash||'').slice(1).toLowerCase(); if(codes[hash]) start=codes[hash];
show(start);
</script>

<title>Tap Together Privacy</title>
<style>
/* Layout: one readable column, logo header in the game's colours, numbered sections as in the app */
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#2B1D10; --muted:#7A5A32; --accent:#D85A30; --green:#1D9E75; --line:#F1E3CC; --chip:#FDEBD3;
  --display:ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,sans-serif; --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1C1712;--card:#27201A;--ink:#F5EBDD;--muted:#C9AE8A;--accent:#F08A5D;--green:#3CC79C;--line:#3A2F25;--chip:#3A2C20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1712;--card:#27201A;--ink:#F5EBDD;--muted:#C9AE8A;--accent:#F08A5D;--green:#3CC79C;--line:#3A2F25;--chip:#3A2C20;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.upd{color:var(--muted);font-size:14px;margin:6px 0 0}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 8px}
.langs button{font:600 13px/1 var(--body);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.langs button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
main{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 22px 14px;margin-top:14px}
section{padding-block:14px;border-bottom:1px solid var(--line)}
section:last-child{border-bottom:0}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 4px;color:var(--accent)}
p{margin:0;max-width:65ch}
.owner{margin-top:8px;padding:12px 14px;background:var(--chip);border-radius:12px;font-size:15px;direction:ltr;text-align:left}
.owner b{font-weight:800} .owner a{color:inherit}
footer{color:var(--muted);font-size:13px;margin-top:18px;text-align:center}
[dir="rtl"] .owner{text-align:left}
@media (prefers-reduced-motion:no-preference){.langs button{transition:background .15s}}
</style>
</head>

<footer>Tap Together · Pavlo Novikov, podnik zahraničnej osoby, Košice, Slovakia<br>This page is hosted on GitHub Pages. GitHub logs the IP address of visitors for security (<a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" style="color:inherit">GitHub Privacy Statement</a>). This page uses no cookies, fonts or scripts from other sites.</footer>

<script>
var PP={"English": {"pp_title": "Tap Together - Privacy Policy", "pp_updated": "Last updated: 16 October 2026", "pp_h1": "1. Overview.", "pp_t1": "Tap Together is a game for parents and young children to play together on one device. It works without collecting any personal data.", "pp_h2": "2. Data stays on your device.", "pp_t2": "Player names, PINs, progress, stars, candies, coins, chosen colours and the levels you draw (including any gallery photo you add to them) are saved only on this device. They are never sent to us or to anyone else. The only exception is feedback: it opens your own email app, and we receive only the message and email address you choose to send, used only to reply to you.", "pp_t2b": "If backup is on in your phone settings, a copy of this game data is also kept in your own iCloud or Google account, so you can restore it on a new phone with the same account. We cannot see this copy. It cannot be moved between iPhone and Android.", "pp_h3": "3. No ads and no tracking.", "pp_t3": "The app shows no third-party ads and uses no analytics, tracking or advertising identifiers. It works offline; only purchases connect to the App Store or Google Play.", "pp_h4": "4. Purchases.", "pp_t4": "Coins, single items and yearly Passes (Starter, Plus, Top) are bought through the App Store or Google Play and are protected by a parental check. A Pass renews every year until you cancel it in your store subscription settings. We never see your payment details.", "pp_t4b": "Purchases belong to your App Store or Google Play account. With each purchase the game sends only an anonymous player ID, so that Restore purchases (in Settings) gives each item back to the right player. Bought coins are kept in the backup, not by the store. Purchases cannot be moved between iPhone and Android.", "pp_h5": "5. Children.", "pp_t5": "The game is made for children aged 5 and under playing with an adult. We do not collect personal information from children.", "pp_h6": "6. Deleting data.", "pp_t6": "To remove one player, use Remove on the Edit Player screen. To remove all game data, delete the app or clear its data in your device settings.", "pp_h7": "7. Who we are and contact.", "pp_t7": "Responsible for this app (data controller):", "pp_place": "Place of business", "pp_home": "Residence", "pp_reg": "Trade register", "pp_h8": "8. Your rights.", "pp_t8": "You can ask us any question about your data. Because we do not collect personal data, nothing about you is stored on our side. You may also complain to the Slovak data protection authority (Úrad na ochranu osobných údajov SR). Consumer supervision: Slovenská obchodná inšpekcia (SOI)."}, "French": {"pp_title": "Tap Together - Politique de confidentialité", "pp_updated": "Dernière mise à jour : 16 octobre 2026", "pp_h1": "1. Présentation.", "pp_t1": "Tap Together est un jeu pour les parents et les jeunes enfants, à jouer ensemble sur un seul appareil. Il fonctionne sans collecter aucune donnée personnelle.", "pp_h2": "2. Les données restent sur votre appareil.", "pp_t2": "Les noms des joueurs, les codes PIN, la progression, les étoiles, les bonbons, les pièces, les couleurs choisies et les niveaux que vous dessinez (y compris une photo de la galerie ajoutée) sont enregistrés uniquement sur cet appareil. Ils ne sont jamais envoyés ni à nous ni à personne d’autre. Seule exception : les commentaires. Ils ouvrent votre propre application de messagerie, et nous recevons uniquement le message et l’adresse e-mail que vous choisissez d’envoyer, utilisés seulement pour vous répondre.", "pp_t2b": "Si la sauvegarde est activée dans les réglages du téléphone, une copie de ces données de jeu est aussi conservée dans votre propre compte iCloud ou Google, pour la restaurer sur un nouveau téléphone avec le même compte. Nous ne pouvons pas voir cette copie. Elle ne peut pas passer d’un iPhone à Android ni l’inverse.", "pp_h3": "3. Pas de publicité ni de suivi.", "pp_t3": "L’application n’affiche aucune publicité de tiers et n’utilise ni analyse, ni suivi, ni identifiant publicitaire. Elle fonctionne hors ligne ; seuls les achats se connectent à l’App Store ou à Google Play.", "pp_h4": "4. Achats.", "pp_t4": "Les pièces, les articles et les Pass annuels (Départ, Plus, Top) s'achètent via l'App Store ou Google Play et sont protégés par un contrôle parental. Un Pass se renouvelle chaque année jusqu'à ce que vous l'annuliez dans les réglages d'abonnement de votre boutique. Nous ne voyons jamais vos données de paiement.", "pp_t4b": "Les achats appartiennent à votre compte App Store ou Google Play. À chaque achat, le jeu envoie seulement un identifiant de joueur anonyme, pour que Restaurer les achats (dans les Réglages) rende chaque article au bon joueur. Les pièces achetées sont gardées dans la sauvegarde, pas par le magasin. Les achats ne passent pas d’un iPhone à Android ni l’inverse.", "pp_h5": "5. Enfants.", "pp_t5": "Le jeu est conçu pour les enfants de 5 ans et moins qui jouent avec un adulte. Nous ne collectons aucune information personnelle auprès des enfants.", "pp_h6": "6. Suppression des données.", "pp_t6": "Pour supprimer un joueur, utilisez Supprimer sur l’écran Modifier le joueur. Pour supprimer toutes les données du jeu, désinstallez l’application ou effacez ses données dans les réglages de l’appareil.", "pp_h7": "7. Qui sommes-nous et contact.", "pp_t7": "Responsable de l'application (responsable du traitement) :", "pp_place": "Lieu d’activité", "pp_home": "Domicile", "pp_reg": "Registre du commerce", "pp_h8": "8. Vos droits.", "pp_t8": "Vous pouvez nous poser toute question sur vos données. Comme nous ne collectons aucune donnée personnelle, rien n'est conservé à votre sujet chez nous. Vous pouvez aussi déposer une plainte auprès de l'autorité slovaque de protection des données (Úrad na ochranu osobných údajov SR). Contrôle de la consommation : Slovenská obchodná inšpekcia (SOI)."}, "German": {"pp_title": "Tap Together - Datenschutzerklärung", "pp_updated": "Zuletzt aktualisiert: 16. Oktober 2026", "pp_h1": "1. Überblick.", "pp_t1": "Tap Together ist ein Spiel für Eltern und kleine Kinder, die zusammen auf einem Gerät spielen. Es funktioniert, ohne personenbezogene Daten zu sammeln.", "pp_h2": "2. Die Daten bleiben auf deinem Gerät.", "pp_t2": "Spielernamen, PINs, Fortschritt, Sterne, Bonbons, Münzen, gewählte Farben und die Level, die du malst (einschließlich Fotos aus der Galerie, die du hinzufügst), werden nur auf diesem Gerät gespeichert. Sie werden nie an uns oder an jemand anderen gesendet. Die einzige Ausnahme ist Feedback: Es öffnet deine eigene E-Mail-App, und wir erhalten nur die Nachricht und die E-Mail-Adresse, die du senden möchtest, und nutzen sie nur, um dir zu antworten.", "pp_t2b": "Wenn in deinen Handy-Einstellungen das Backup an ist, wird eine Kopie dieser Spieldaten auch in deinem eigenen iCloud- oder Google-Konto gespeichert, damit du sie auf einem neuen Handy mit demselben Konto wiederherstellen kannst. Wir können diese Kopie nicht sehen. Sie kann nicht zwischen iPhone und Android übertragen werden.", "pp_h3": "3. Keine Werbung und kein Tracking.", "pp_t3": "Die App zeigt keine Werbung von Dritten und nutzt keine Analyse-, Tracking- oder Werbe-IDs. Sie funktioniert offline; nur Käufe verbinden sich mit dem App Store oder Google Play.", "pp_h4": "4. Käufe.", "pp_t4": "Münzen, einzelne Artikel und Jahres-Pässe (Starter, Plus, Top) werden über den App Store oder Google Play gekauft und sind durch eine Elternprüfung geschützt. Ein Pass verlängert sich jedes Jahr, bis du ihn in den Abo-Einstellungen deines Stores kündigst. Wir sehen deine Zahlungsdaten nie.", "pp_t4b": "Käufe gehören zu deinem App-Store- oder Google-Play-Konto. Bei jedem Kauf sendet das Spiel nur eine anonyme Spieler-ID, damit „Käufe wiederherstellen“ (in den Einstellungen) jeden Artikel dem richtigen Spieler zurückgibt. Gekaufte Münzen sind im Backup gespeichert, nicht im Store. Käufe können nicht zwischen iPhone und Android übertragen werden.", "pp_h5": "5. Kinder.", "pp_t5": "Das Spiel ist für Kinder bis 5 Jahre gemacht, die mit einem Erwachsenen spielen. Wir sammeln keine personenbezogenen Daten von Kindern.", "pp_h6": "6. Daten löschen.", "pp_t6": "Um einen Spieler zu entfernen, nutze „Entfernen“ auf dem Bildschirm „Spieler bearbeiten“. Um alle Spieldaten zu entfernen, lösche die App oder ihre Daten in den Geräteeinstellungen.", "pp_h7": "7. Wer wir sind und Kontakt.", "pp_t7": "Verantwortlich für diese App (Verantwortlicher im Sinne der DSGVO):", "pp_place": "Geschäftssitz", "pp_home": "Wohnsitz", "pp_reg": "Gewerberegister", "pp_h8": "8. Deine Rechte.", "pp_t8": "Du kannst uns jede Frage zu deinen Daten stellen. Da wir keine personenbezogenen Daten sammeln, ist bei uns nichts über dich gespeichert. Du kannst dich auch bei der slowakischen Datenschutzbehörde (Úrad na ochranu osobných údajov SR) beschweren. Verbraucheraufsicht: Slovenská obchodná inšpekcia (SOI)."}, "Spanish": {"pp_title": "Tap Together - Política de privacidad", "pp_updated": "Última actualización: 16 de octubre de 2026", "pp_h1": "1. Resumen.", "pp_t1": "Tap Together es un juego para que padres y niños pequeños jueguen juntos en un solo dispositivo. Funciona sin recopilar ningún dato personal.", "pp_h2": "2. Los datos se quedan en tu dispositivo.", "pp_t2": "Los nombres de los jugadores, los PIN, el progreso, las estrellas, los caramelos, las monedas, los colores elegidos y los niveles que dibujas (incluida cualquier foto de la galería que añadas) se guardan solo en este dispositivo. Nunca se envían a nosotros ni a nadie más. La única excepción son los comentarios: abren tu propia aplicación de correo y solo recibimos el mensaje y la dirección de correo que decidas enviar, que usamos únicamente para responderte.", "pp_t2b": "Si la copia de seguridad está activada en los ajustes del teléfono, también se guarda una copia de estos datos del juego en tu propia cuenta de iCloud o Google, para restaurarla en un teléfono nuevo con la misma cuenta. Nosotros no podemos ver esa copia. No se puede pasar entre iPhone y Android.", "pp_h3": "3. Sin anuncios ni seguimiento.", "pp_t3": "La aplicación no muestra anuncios de terceros y no usa analíticas, seguimiento ni identificadores publicitarios. Funciona sin conexión; solo las compras se conectan a la App Store o a Google Play.", "pp_h4": "4. Compras.", "pp_t4": "Las monedas, los artículos y los Pases anuales (Inicio, Plus, Top) se compran a través de App Store o Google Play y están protegidos por un control parental. Un Pase se renueva cada año hasta que lo canceles en los ajustes de suscripción de tu tienda. Nunca vemos tus datos de pago.", "pp_t4b": "Las compras pertenecen a tu cuenta de App Store o Google Play. Con cada compra el juego envía solo un identificador anónimo del jugador, para que Restaurar compras (en Ajustes) devuelva cada artículo al jugador correcto. Las monedas compradas se guardan en la copia de seguridad, no en la tienda. Las compras no se pueden pasar entre iPhone y Android.", "pp_h5": "5. Niños.", "pp_t5": "El juego está pensado para niños de 5 años o menos que juegan con un adulto. No recopilamos información personal de los niños.", "pp_h6": "6. Borrar los datos.", "pp_t6": "Para eliminar a un jugador, usa Eliminar en la pantalla Editar jugador. Para eliminar todos los datos del juego, borra la aplicación o sus datos en los ajustes del dispositivo.", "pp_h7": "7. Quiénes somos y contacto.", "pp_t7": "Responsable de la app (responsable del tratamiento):", "pp_place": "Domicilio comercial", "pp_home": "Residencia", "pp_reg": "Registro mercantil", "pp_h8": "8. Tus derechos.", "pp_t8": "Puedes hacernos cualquier pregunta sobre tus datos. Como no recopilamos datos personales, no guardamos nada sobre ti. También puedes presentar una reclamación ante la autoridad eslovaca de protección de datos (Úrad na ochranu osobných údajov SR). Supervisión de consumo: Slovenská obchodná inšpekcia (SOI)."}, "Russian": {"pp_title": "Tap Together - Политика конфиденциальности", "pp_updated": "Последнее обновление: 16 октября 2026 г.", "pp_h1": "1. Общие сведения.", "pp_t1": "Tap Together - игра для родителей и маленьких детей, в которую играют вместе на одном устройстве. Она работает, не собирая никаких персональных данных.", "pp_h2": "2. Данные остаются на устройстве.", "pp_t2": "Имена игроков, PIN-коды, прогресс, звёзды, конфеты, монеты, выбранные цвета и нарисованные вами уровни (в том числе добавленное фото из галереи) хранятся только на этом устройстве. Они никогда не передаются ни нам, ни кому-либо ещё. Единственное исключение — отзыв: он открывает ваше почтовое приложение, и мы получаем только сообщение и адрес почты, которые вы сами решили отправить, и используем их только для ответа вам.", "pp_t2b": "Если в настройках телефона включено резервное копирование, копия этих данных игры также хранится в вашем собственном аккаунте iCloud или Google, чтобы восстановить её на новом телефоне с тем же аккаунтом. Мы не видим эту копию. Её нельзя перенести между iPhone и Android.", "pp_h3": "3. Без рекламы и отслеживания.", "pp_t3": "В приложении нет сторонней рекламы, аналитики, отслеживания и рекламных идентификаторов. Оно работает без интернета; только покупки подключаются к App Store или Google Play.", "pp_h4": "4. Покупки.", "pp_t4": "Монеты, отдельные предметы и годовые абонементы (Старт, Плюс, Топ) покупаются через App Store или Google Play и защищены родительской проверкой. Абонемент продлевается каждый год, пока вы не отмените его в настройках подписок магазина. Мы никогда не видим ваши платёжные данные.", "pp_t4b": "Покупки принадлежат вашему аккаунту App Store или Google Play. С каждой покупкой игра передаёт только анонимный идентификатор игрока, чтобы «Восстановить покупки» (в Настройках) вернуло каждую вещь нужному игроку. Купленные монеты хранятся в резервной копии, а не в магазине. Покупки нельзя перенести между iPhone и Android.", "pp_h5": "5. Дети.", "pp_t5": "Игра создана для детей до 5 лет, которые играют вместе со взрослым. Мы не собираем персональные данные детей.", "pp_h6": "6. Удаление данных.", "pp_t6": "Чтобы удалить одного игрока, нажмите «Удалить» на экране «Редактировать игрока». Чтобы удалить все данные игры, удалите приложение или очистите его данные в настройках устройства.", "pp_h7": "7. Кто мы и контакты.", "pp_t7": "Ответственный за приложение (оператор данных):", "pp_place": "Место деятельности", "pp_home": "Место жительства", "pp_reg": "Торговый реестр", "pp_h8": "8. Ваши права.", "pp_t8": "Вы можете задать нам любой вопрос о ваших данных. Поскольку мы не собираем персональные данные, у нас ничего о вас не хранится. Вы также можете подать жалобу в словацкий орган по защите данных (Úrad na ochranu osobných údajov SR). Надзор за защитой потребителей: Slovenská obchodná inšpekcia (SOI)."}, "Ukrainian": {"pp_title": "Tap Together - Політика конфіденційності", "pp_updated": "Останнє оновлення: 16 жовтня 2026 р.", "pp_h1": "1. Загальні відомості.", "pp_t1": "Tap Together - гра для батьків і маленьких дітей, у яку грають разом на одному пристрої. Вона працює, не збираючи жодних персональних даних.", "pp_h2": "2. Дані залишаються на пристрої.", "pp_t2": "Імена гравців, PIN-коди, прогрес, зірки, цукерки, монети, вибрані кольори та намальовані вами рівні (зокрема додане фото з галереї) зберігаються лише на цьому пристрої. Вони ніколи не передаються ні нам, ні будь-кому іншому. Єдиний виняток — відгук: він відкриває ваш поштовий застосунок, і ми отримуємо лише повідомлення та адресу пошти, які ви самі вирішили надіслати, і використовуємо їх тільки для відповіді вам.", "pp_t2b": "Якщо в налаштуваннях телефона увімкнено резервне копіювання, копія цих даних гри також зберігається у вашому власному акаунті iCloud або Google, щоб відновити її на новому телефоні з тим самим акаунтом. Ми не бачимо цієї копії. Її не можна перенести між iPhone і Android.", "pp_h3": "3. Без реклами і стеження.", "pp_t3": "У застосунку немає сторонньої реклами, аналітики, стеження та рекламних ідентифікаторів. Він працює без інтернету; лише покупки підключаються до App Store або Google Play.", "pp_h4": "4. Покупки.", "pp_t4": "Монети, окремі предмети та річні абонементи (Старт, Плюс, Топ) купуються через App Store або Google Play і захищені батьківською перевіркою. Абонемент подовжується щороку, доки ви не скасуєте його в налаштуваннях підписок магазину. Ми ніколи не бачимо ваших платіжних даних.", "pp_t4b": "Покупки належать вашому акаунту App Store або Google Play. З кожною покупкою гра передає лише анонімний ідентифікатор гравця, щоб «Відновити покупки» (у Налаштуваннях) повернуло кожну річ потрібному гравцю. Куплені монети зберігаються в резервній копії, а не в магазині. Покупки не можна перенести між iPhone і Android.", "pp_h5": "5. Діти.", "pp_t5": "Гра створена для дітей до 5 років, які грають разом із дорослим. Ми не збираємо персональних даних дітей.", "pp_h6": "6. Видалення даних.", "pp_t6": "Щоб видалити одного гравця, натисніть «Видалити» на екрані «Редагувати гравця». Щоб видалити всі дані гри, видаліть застосунок або очистіть його дані в налаштуваннях пристрою.", "pp_h7": "7. Хто ми і контакти.", "pp_t7": "Відповідальний за застосунок (контролер даних):", "pp_place": "Місце діяльності", "pp_home": "Місце проживання", "pp_reg": "Реєстр підприємців", "pp_h8": "8. Ваші права.", "pp_t8": "Ви можете поставити нам будь-яке питання щодо ваших даних. Оскільки ми не збираємо персональних даних, у нас нічого про вас не зберігається. Ви також можете подати скаргу до словацького органу із захисту даних (Úrad na ochranu osobných údajov SR). Нагляд за захистом споживачів: Slovenská obchodná inšpekcia (SOI)."}, "Slovak": {"pp_title": "Tap Together - Zásady ochrany súkromia", "pp_updated": "Posledná aktualizácia: 16. októbra 2026", "pp_h1": "1. Prehľad.", "pp_t1": "Tap Together je hra pre rodičov a malé deti, ktorú hrajú spolu na jednom zariadení. Funguje bez zbierania akýchkoľvek osobných údajov.", "pp_h2": "2. Údaje zostávajú vo vašom zariadení.", "pp_t2": "Mená hráčov, PIN kódy, postup, hviezdy, cukríky, mince, zvolené farby a úrovne, ktoré nakreslíte (vrátane pridanej fotky z galérie), sa ukladajú iba v tomto zariadení. Nikdy sa neposielajú nám ani nikomu inému. Jedinou výnimkou je spätná väzba: otvorí vašu vlastnú e-mailovú aplikáciu a my dostaneme iba správu a e-mailovú adresu, ktoré sa rozhodnete poslať, a použijeme ich len na odpoveď.", "pp_t2b": "Ak je v nastaveniach telefónu zapnutá záloha, kópia týchto herných údajov sa uchováva aj vo vašom vlastnom účte iCloud alebo Google, aby ste ju mohli obnoviť v novom telefóne s rovnakým účtom. Túto kópiu nevidíme. Nedá sa preniesť medzi iPhonom a Androidom.", "pp_h3": "3. Žiadne reklamy ani sledovanie.", "pp_t3": "Aplikácia nezobrazuje reklamy tretích strán a nepoužíva analytiku, sledovanie ani reklamné identifikátory. Funguje offline; len nákupy sa pripájajú k App Store alebo Google Play.", "pp_h4": "4. Nákupy.", "pp_t4": "Mince, jednotlivé položky a ročné predplatné (Štart, Plus, Top) sa kupujú cez App Store alebo Google Play a sú chránené rodičovskou kontrolou. Predplatné sa obnovuje každý rok, kým ho nezrušíte v nastaveniach predplatného v obchode. Vaše platobné údaje nikdy nevidíme.", "pp_t4b": "Nákupy patria vášmu účtu App Store alebo Google Play. Pri každom nákupe hra posiela iba anonymný identifikátor hráča, aby Obnoviť nákupy (v Nastaveniach) vrátilo každú vec správnemu hráčovi. Kúpené mince sa uchovávajú v zálohe, nie v obchode. Nákupy sa nedajú preniesť medzi iPhonom a Androidom.", "pp_h5": "5. Deti.", "pp_t5": "Hra je určená pre deti do 5 rokov, ktoré hrajú spolu s dospelým. Od detí nezbierame žiadne osobné údaje.", "pp_h6": "6. Vymazanie údajov.", "pp_t6": "Ak chcete odstrániť jedného hráča, použite Odstrániť na obrazovke Upraviť hráča. Ak chcete odstrániť všetky údaje hry, odinštalujte aplikáciu alebo vymažte jej údaje v nastaveniach zariadenia.", "pp_h7": "7. Kto sme a kontakt.", "pp_t7": "Zodpovedný za aplikáciu (prevádzkovateľ):", "pp_place": "Miesto podnikania", "pp_home": "Bydlisko", "pp_reg": "Živnostenský register", "pp_h8": "8. Vaše práva.", "pp_t8": "Na čokoľvek o vašich údajoch sa nás môžete opýtať. Keďže nezbierame osobné údaje, neuchovávame o vás nič. Sťažnosť môžete podať aj na Úrad na ochranu osobných údajov SR. Dozor nad ochranou spotrebiteľa: Slovenská obchodná inšpekcia (SOI)."}, "Polish": {"pp_title": "Tap Together - Polityka prywatności", "pp_updated": "Ostatnia aktualizacja: 16 października 2026", "pp_h1": "1. Informacje ogólne.", "pp_t1": "Tap Together to gra dla rodziców i małych dzieci, w którą gra się razem na jednym urządzeniu. Działa bez zbierania jakichkolwiek danych osobowych.", "pp_h2": "2. Dane zostają na urządzeniu.", "pp_t2": "Imiona graczy, kody PIN, postępy, gwiazdki, cukierki, monety, wybrane kolory i narysowane przez Ciebie poziomy (w tym dodane zdjęcie z galerii) są zapisywane tylko na tym urządzeniu. Nigdy nie są wysyłane do nas ani do nikogo innego. Jedynym wyjątkiem jest opinia: otwiera ona Twoją aplikację pocztową, a my otrzymujemy tylko wiadomość i adres e-mail, które zdecydujesz się wysłać, i używamy ich wyłącznie do odpowiedzi.", "pp_t2b": "Jeśli w ustawieniach telefonu włączona jest kopia zapasowa, kopia tych danych gry jest też przechowywana na Twoim własnym koncie iCloud lub Google, aby można ją było przywrócić na nowym telefonie z tym samym kontem. Nie widzimy tej kopii. Nie można jej przenieść między iPhone’em a Androidem.", "pp_h3": "3. Bez reklam i śledzenia.", "pp_t3": "Aplikacja nie wyświetla reklam firm trzecich i nie używa analityki, śledzenia ani identyfikatorów reklamowych. Działa offline; tylko zakupy łączą się z App Store lub Google Play.", "pp_h4": "4. Zakupy.", "pp_t4": "Monety, pojedyncze przedmioty i roczne karnety (Start, Plus, Top) kupuje się przez App Store lub Google Play i są chronione kontrolą rodzicielską. Karnet odnawia się co roku, dopóki nie anulujesz go w ustawieniach subskrypcji sklepu. Nigdy nie widzimy Twoich danych płatniczych.", "pp_t4b": "Zakupy należą do Twojego konta App Store lub Google Play. Przy każdym zakupie gra wysyła tylko anonimowy identyfikator gracza, aby Przywróć zakupy (w Ustawieniach) oddało każdy przedmiot właściwemu graczowi. Kupione monety są przechowywane w kopii zapasowej, a nie przez sklep. Zakupów nie można przenieść między iPhone’em a Androidem.", "pp_h5": "5. Dzieci.", "pp_t5": "Gra jest przeznaczona dla dzieci do 5 lat grających razem z dorosłym. Nie zbieramy danych osobowych od dzieci.", "pp_h6": "6. Usuwanie danych.", "pp_t6": "Aby usunąć jednego gracza, użyj przycisku Usuń na ekranie Edytuj gracza. Aby usunąć wszystkie dane gry, odinstaluj aplikację lub wyczyść jej dane w ustawieniach urządzenia.", "pp_h7": "7. Kim jesteśmy i kontakt.", "pp_t7": "Odpowiedzialny za aplikację (administrator danych):", "pp_place": "Miejsce prowadzenia działalności", "pp_home": "Miejsce zamieszkania", "pp_reg": "Rejestr działalności gospodarczej", "pp_h8": "8. Twoje prawa.", "pp_t8": "Możesz zadać nam każde pytanie o swoje dane. Ponieważ nie zbieramy danych osobowych, nie przechowujemy niczego na Twój temat. Możesz też złożyć skargę do słowackiego organu ochrony danych (Úrad na ochranu osobných údajov SR). Nadzór konsumencki: Slovenská obchodná inšpekcia (SOI)."}, "Italian": {"pp_title": "Tap Together - Informativa sulla privacy", "pp_updated": "Ultimo aggiornamento: 16 ottobre 2026", "pp_h1": "1. Panoramica.", "pp_t1": "Tap Together è un gioco per genitori e bambini piccoli da fare insieme su un unico dispositivo. Funziona senza raccogliere alcun dato personale.", "pp_h2": "2. I dati restano sul dispositivo.", "pp_t2": "I nomi dei giocatori, i PIN, i progressi, le stelle, le caramelle, le monete, i colori scelti e i livelli che disegni (compresa una foto della galleria aggiunta) vengono salvati solo su questo dispositivo. Non vengono mai inviati a noi né a nessun altro. L’unica eccezione è il feedback: apre la tua app di posta e riceviamo solo il messaggio e l’indirizzo e-mail che scegli di inviare, usati solo per risponderti.", "pp_t2b": "Se il backup è attivo nelle impostazioni del telefono, una copia di questi dati di gioco viene conservata anche nel tuo account iCloud o Google, per ripristinarla su un nuovo telefono con lo stesso account. Noi non possiamo vedere questa copia. Non può essere spostata tra iPhone e Android.", "pp_h3": "3. Niente pubblicità né tracciamento.", "pp_t3": "L’app non mostra pubblicità di terzi e non usa analisi, tracciamento né identificativi pubblicitari. Funziona offline; solo gli acquisti si collegano all’App Store o a Google Play.", "pp_h4": "4. Acquisti.", "pp_t4": "Monete, singoli oggetti e Pass annuali (Inizio, Plus, Top) si acquistano tramite App Store o Google Play e sono protetti da un controllo parentale. Un Pass si rinnova ogni anno finché non lo annulli nelle impostazioni degli abbonamenti dello store. Non vediamo mai i tuoi dati di pagamento.", "pp_t4b": "Gli acquisti appartengono al tuo account App Store o Google Play. A ogni acquisto il gioco invia solo un identificativo anonimo del giocatore, così Ripristina acquisti (nelle Impostazioni) restituisce ogni oggetto al giocatore giusto. Le monete acquistate sono conservate nel backup, non dallo store. Gli acquisti non possono essere spostati tra iPhone e Android.", "pp_h5": "5. Bambini.", "pp_t5": "Il gioco è pensato per bambini fino a 5 anni che giocano con un adulto. Non raccogliamo informazioni personali dai bambini.", "pp_h6": "6. Eliminazione dei dati.", "pp_t6": "Per rimuovere un giocatore, usa Rimuovi nella schermata Modifica giocatore. Per rimuovere tutti i dati del gioco, elimina l’app o cancellane i dati nelle impostazioni del dispositivo.", "pp_h7": "7. Chi siamo e contatti.", "pp_t7": "Responsabile dell'app (titolare del trattamento):", "pp_place": "Sede dell’attività", "pp_home": "Residenza", "pp_reg": "Registro delle imprese", "pp_h8": "8. I tuoi diritti.", "pp_t8": "Puoi farci qualsiasi domanda sui tuoi dati. Poiché non raccogliamo dati personali, non conserviamo nulla su di te. Puoi anche presentare un reclamo all'autorità slovacca per la protezione dei dati (Úrad na ochranu osobných údajov SR). Vigilanza sui consumatori: Slovenská obchodná inšpekcia (SOI)."}, "Chinese": {"pp_title": "Tap Together - 隐私政策", "pp_updated": "最后更新：2026年10月16日", "pp_h1": "1. 概述。", "pp_t1": "Tap Together 是一款供家长和幼儿在同一台设备上一起玩的游戏。它在运行时不收集任何个人数据。", "pp_h2": "2. 数据只保存在您的设备上。", "pp_t2": "玩家名字、PIN 码、进度、星星、糖果、金币、选择的颜色以及你绘制的关卡（包括你添加的相册照片）只保存在这台设备上，绝不会发送给我们或任何其他人。唯一的例外是反馈：它会打开你自己的邮件应用，我们只会收到你选择发送的留言和邮箱地址，仅用于回复你。", "pp_t2b": "如果在手机设置中打开了备份，这些游戏数据的副本也会保存在你自己的 iCloud 或 Google 账号中，以便在使用同一账号的新手机上恢复。我们无法看到这份副本。它不能在 iPhone 和 Android 之间转移。", "pp_h3": "3. 无广告，无跟踪。", "pp_t3": "本应用不显示第三方广告，也不使用任何分析、跟踪或广告标识符。它可离线使用；只有购买时会连接 App Store 或 Google Play。", "pp_h4": "4. 购买。", "pp_t4": "金币、单个物品和年度通行证（入门、进阶、顶级）通过 App Store 或 Google Play 购买，并受家长验证保护。通行证每年自动续订，直到你在商店的订阅设置中取消。我们永远看不到你的付款信息。", "pp_t4b": "购买属于你的 App Store 或 Google Play 账号。每次购买时，游戏只发送一个匿名的玩家编号，这样“恢复购买”（在设置中）就能把每件物品还给正确的玩家。购买的金币保存在备份中，而不是由商店保存。购买不能在 iPhone 和 Android 之间转移。", "pp_h5": "5. 儿童。", "pp_t5": "本游戏专为5岁及以下、在成人陪伴下玩耍的儿童设计。我们不收集儿童的任何个人信息。", "pp_h6": "6. 删除数据。", "pp_t6": "要删除一位玩家，请在“编辑玩家”界面点击“删除”。要删除所有游戏数据，请卸载应用或在设备设置中清除其数据。", "pp_h7": "7. 关于我们与联系方式。", "pp_t7": "本应用负责人（数据控制者）：", "pp_place": "经营地址", "pp_home": "居住地址", "pp_reg": "工商登记", "pp_h8": "8. 你的权利。", "pp_t8": "你可以就你的数据向我们提出任何问题。由于我们不收集个人数据，我们这里没有保存任何关于你的信息。你也可以向斯洛伐克数据保护机构（Úrad na ochranu osobných údajov SR）投诉。消费者监管机构：Slovenská obchodná inšpekcia（SOI）。"}, "Japanese": {"pp_title": "Tap Together - プライバシーポリシー", "pp_updated": "最終更新日：2026年10月16日", "pp_h1": "1. 概要。", "pp_t1": "Tap Together は、保護者と小さなお子さまが1台の端末でいっしょに遊ぶゲームです。個人データを一切収集せずに動作します。", "pp_h2": "2. データは端末内にのみ保存されます。", "pp_t2": "プレイヤー名、PIN、進み具合、星、キャンディ、コイン、選んだ色、そして描いたステージ（追加したギャラリーの写真を含む）はこの端末にのみ保存されます。私たちやほかの誰かに送信されることはありません。唯一の例外はご意見の送信です。お使いのメールアプリが開き、送ると決めたメッセージとメールアドレスだけを受け取り、返信のためだけに使います。", "pp_t2b": "スマホの設定でバックアップがオンの場合、このゲームデータのコピーはご自身の iCloud または Google アカウントにも保存され、同じアカウントの新しいスマホで復元できます。私たちはこのコピーを見ることができません。iPhone と Android の間では移せません。", "pp_h3": "3. 広告やトラッキングはありません。", "pp_t3": "このアプリは第三者の広告を表示せず、分析、トラッキング、広告IDを一切使用しません。オフラインで動作し、購入のときだけ App Store または Google Play に接続します。", "pp_h4": "4. 購入について。", "pp_t4": "コイン、アイテム、年間パス（スタート・プラス・トップ）は App Store または Google Play で購入でき、保護者チェックで守られています。パスはストアのサブスクリプション設定で解約するまで毎年更新されます。お支払い情報が私たちに見えることはありません。", "pp_t4b": "購入はお使いの App Store または Google Play のアカウントに属します。購入のたびに、ゲームは匿名のプレイヤーIDだけを送るので、「購入を復元」（設定）で各アイテムが正しいプレイヤーにもどります。買ったコインはストアではなくバックアップに保存されます。購入は iPhone と Android の間で移せません。", "pp_h5": "5. お子さまについて。", "pp_t5": "このゲームは、大人といっしょに遊ぶ5歳以下のお子さま向けです。お子さまから個人情報を収集することはありません。", "pp_h6": "6. データの削除。", "pp_t6": "プレイヤーを1人削除するには、「プレイヤーを編集」画面の「削除」を使います。ゲームのデータをすべて削除するには、アプリを削除するか、端末の設定でアプリのデータを消去してください。", "pp_h7": "7. 運営者と連絡先。", "pp_t7": "アプリの責任者（データ管理者）：", "pp_place": "事業所の所在地", "pp_home": "住所", "pp_reg": "事業者登録", "pp_h8": "8. あなたの権利。", "pp_t8": "データについてのご質問はいつでもどうぞ。個人データを集めていないため、私たちの側にはあなたの情報は何も保存されていません。スロバキアのデータ保護当局（Úrad na ochranu osobných údajov SR）に苦情を申し立てることもできます。消費者保護の監督機関：Slovenská obchodná inšpekcia（SOI）。"}, "Hindi": {"pp_title": "Tap Together - गोपनीयता नीति", "pp_updated": "आख़िरी अपडेट: 16 अक्टूबर 2026", "pp_h1": "1. सारांश।", "pp_t1": "Tap Together माता-पिता और छोटे बच्चों के लिए एक डिवाइस पर साथ खेलने का खेल है। यह कोई निजी डेटा इकट्ठा किए बिना काम करता है।", "pp_h2": "2. डेटा आपके डिवाइस पर ही रहता है।", "pp_t2": "खिलाड़ियों के नाम, PIN, प्रगति, सितारे, कैंडी, सिक्के, चुने गए रंग और आपके बनाए लेवल (उनमें जोड़ी गई गैलरी फ़ोटो सहित) सिर्फ़ इसी डिवाइस पर सहेजे जाते हैं। ये कभी हमें या किसी और को नहीं भेजे जाते। एकमात्र अपवाद फ़ीडबैक है: यह आपका अपना ईमेल ऐप खोलता है, और हमें सिर्फ़ वही संदेश और ईमेल पता मिलता है जो आप भेजना चुनते हैं, जिसका उपयोग सिर्फ़ आपको जवाब देने के लिए होता है।", "pp_t2b": "अगर आपके फ़ोन की सेटिंग्स में बैकअप चालू है, तो इस खेल के डेटा की एक कॉपी आपके अपने iCloud या Google खाते में भी रहती है, ताकि आप उसी खाते वाले नए फ़ोन पर इसे वापस ला सकें। हम यह कॉपी नहीं देख सकते। इसे iPhone और Android के बीच नहीं ले जाया जा सकता।", "pp_h3": "3. कोई विज्ञापन और कोई ट्रैकिंग नहीं।", "pp_t3": "ऐप किसी तीसरे पक्ष के विज्ञापन नहीं दिखाता और कोई एनालिटिक्स, ट्रैकिंग या विज्ञापन पहचानकर्ता इस्तेमाल नहीं करता। यह ऑफ़लाइन काम करता है; सिर्फ़ ख़रीदारी के लिए App Store या Google Play से जुड़ता है।", "pp_h4": "4. ख़रीदारी।", "pp_t4": "सिक्के, अलग-अलग चीज़ें और सालाना पास (स्टार्टर, प्लस, टॉप) App Store या Google Play से ख़रीदे जाते हैं और माता-पिता की जाँच से सुरक्षित हैं। पास हर साल अपने-आप नवीनीकृत होता है जब तक आप उसे अपने स्टोर की सदस्यता सेटिंग्स में रद्द न करें। हम आपकी भुगतान जानकारी कभी नहीं देखते।", "pp_t4b": "ख़रीदारी आपके App Store या Google Play खाते से जुड़ी होती है। हर ख़रीदारी के साथ खेल सिर्फ़ एक गुमनाम खिलाड़ी ID भेजता है, ताकि ख़रीदारी वापस लाएँ (सेटिंग्स में) हर चीज़ सही खिलाड़ी को लौटाए। ख़रीदे गए सिक्के बैकअप में रहते हैं, स्टोर में नहीं। ख़रीदारी iPhone और Android के बीच नहीं ले जाई जा सकती।", "pp_h5": "5. बच्चे।", "pp_t5": "यह खेल 5 साल और उससे छोटे बच्चों के लिए है जो किसी बड़े के साथ खेलते हैं। हम बच्चों से कोई निजी जानकारी इकट्ठा नहीं करते।", "pp_h6": "6. डेटा मिटाना।", "pp_t6": "किसी एक खिलाड़ी को हटाने के लिए खिलाड़ी बदलें स्क्रीन पर हटाएँ दबाएँ। खेल का सारा डेटा हटाने के लिए ऐप को डिलीट करें या डिवाइस की सेटिंग्स में उसका डेटा साफ़ करें।", "pp_h7": "7. हम कौन हैं और संपर्क।", "pp_t7": "इस ऐप के लिए ज़िम्मेदार (डेटा नियंत्रक):", "pp_place": "कारोबार का स्थान", "pp_home": "निवास", "pp_reg": "व्यापार रजिस्टर", "pp_h8": "8. आपके अधिकार।", "pp_t8": "आप अपने डेटा के बारे में हमसे कोई भी सवाल पूछ सकते हैं। क्योंकि हम निजी डेटा इकट्ठा नहीं करते, आपके बारे में हमारे पास कुछ भी सहेजा नहीं जाता। आप स्लोवाकिया के डेटा संरक्षण प्राधिकरण (Úrad na ochranu osobných údajov SR) से भी शिकायत कर सकते हैं। उपभोक्ता निगरानी: Slovenská obchodná inšpekcia (SOI)।"}, "Arabic": {"pp_title": "Tap Together - سياسة الخصوصية", "pp_updated": "آخر تحديث: 16 أكتوبر 2026", "pp_h1": "1. نظرة عامة.", "pp_t1": "Tap Together لعبة يلعبها الآباء والأطفال الصغار معًا على جهاز واحد. وهي تعمل دون جمع أي بيانات شخصية.", "pp_h2": "2. تبقى البيانات على جهازك.", "pp_t2": "تُحفظ أسماء اللاعبين ورموز PIN والتقدم والنجوم والحلوى والعملات والألوان المختارة والمراحل التي ترسمها (بما في ذلك أي صورة من المعرض تضيفها) على هذا الجهاز فقط، ولا تُرسل إلينا أو إلى أي شخص آخر أبدًا. الاستثناء الوحيد هو الملاحظات: فهي تفتح تطبيق البريد الخاص بك، ولا نتلقى إلا الرسالة وعنوان البريد الإلكتروني اللذين تختار إرسالهما، ونستخدمهما فقط للرد عليك.", "pp_t2b": "إذا كان النسخ الاحتياطي مفعّلًا في إعدادات الهاتف، فتُحفظ نسخة من بيانات اللعبة هذه أيضًا في حسابك الخاص على iCloud أو Google، حتى تتمكن من استعادتها على هاتف جديد بالحساب نفسه. لا يمكننا رؤية هذه النسخة. ولا يمكن نقلها بين iPhone وAndroid.", "pp_h3": "3. لا إعلانات ولا تتبع.", "pp_t3": "لا يعرض التطبيق إعلانات من أطراف ثالثة ولا يستخدم أي تحليلات أو تتبع أو معرّفات إعلانية. يعمل دون اتصال بالإنترنت؛ وتتصل عمليات الشراء فقط بمتجر App Store أو Google Play.", "pp_h4": "4. المشتريات.", "pp_t4": "تُشترى العملات والعناصر الفردية والاشتراكات السنوية (البداية وبلس وتوب) عبر App Store أو Google Play وهي محمية بتحقق من الوالدين. يتجدد الاشتراك كل عام حتى تلغيه من إعدادات الاشتراكات في المتجر. لا نرى أبدًا بيانات الدفع الخاصة بك.", "pp_t4b": "المشتريات تخص حسابك على App Store أو Google Play. مع كل عملية شراء ترسل اللعبة معرّفًا مجهولًا للاعب فقط، حتى تعيد «استعادة المشتريات» (في الإعدادات) كل عنصر إلى اللاعب الصحيح. تُحفظ العملات المشتراة في النسخة الاحتياطية وليس لدى المتجر. لا يمكن نقل المشتريات بين iPhone وAndroid.", "pp_h5": "5. الأطفال.", "pp_t5": "صُممت اللعبة للأطفال بعمر 5 سنوات فما دون الذين يلعبون مع شخص بالغ. لا نجمع أي معلومات شخصية من الأطفال.", "pp_h6": "6. حذف البيانات.", "pp_t6": "لإزالة لاعب واحد، استخدم «إزالة» في شاشة «تعديل اللاعب». لإزالة كل بيانات اللعبة، احذف التطبيق أو امسح بياناته من إعدادات جهازك.", "pp_h7": "7. من نحن وكيفية التواصل.", "pp_t7": "المسؤول عن التطبيق (المتحكم في البيانات):", "pp_place": "مكان مزاولة النشاط", "pp_home": "مكان الإقامة", "pp_reg": "السجل التجاري", "pp_h8": "8. حقوقك.", "pp_t8": "يمكنك أن تسألنا أي سؤال عن بياناتك. وبما أننا لا نجمع أي بيانات شخصية، فلا نحتفظ بأي شيء عنك. يمكنك أيضًا تقديم شكوى إلى هيئة حماية البيانات السلوفاكية (Úrad na ochranu osobných údajov SR). جهة الرقابة على حماية المستهلك: Slovenská obchodná inšpekcia (SOI)."}, "Hebrew": {"pp_title": "Tap Together - מדיניות פרטיות", "pp_updated": "עדכון אחרון: 16 באוקטובר 2026", "pp_h1": "1. סקירה כללית.", "pp_t1": "Tap Together הוא משחק להורים ולילדים קטנים שמשחקים יחד במכשיר אחד. הוא פועל בלי לאסוף מידע אישי כלשהו.", "pp_h2": "2. המידע נשאר במכשיר שלך.", "pp_t2": "שמות השחקנים, קודי ה-PIN, ההתקדמות, הכוכבים, הסוכריות, המטבעות, הצבעים שנבחרו והשלבים שאתם מציירים (כולל תמונה מהגלריה שהוספתם) נשמרים רק במכשיר הזה. הם אף פעם לא נשלחים אלינו או לאף אחד אחר. החריג היחיד הוא משוב: הוא פותח את אפליקציית הדואר שלכם, ואנחנו מקבלים רק את ההודעה ואת כתובת הדוא״ל שבחרתם לשלוח, ומשתמשים בהן רק כדי להשיב לכם.", "pp_t2b": "אם הגיבוי מופעל בהגדרות הטלפון, עותק של נתוני המשחק נשמר גם בחשבון iCloud או Google שלכם, כדי שתוכלו לשחזר אותו בטלפון חדש עם אותו חשבון. אנחנו לא יכולים לראות את העותק הזה. אי אפשר להעביר אותו בין iPhone ל-Android.", "pp_h3": "3. בלי פרסומות ובלי מעקב.", "pp_t3": "האפליקציה לא מציגה פרסומות של צד שלישי ולא משתמשת בניתוח נתונים, במעקב או במזהי פרסום. היא פועלת ללא אינטרנט; רק רכישות מתחברות ל-App Store או ל-Google Play.", "pp_h4": "4. רכישות.", "pp_t4": "מטבעות, פריטים בודדים ומינויים שנתיים (התחלה, פלוס, טופ) נרכשים דרך App Store או Google Play ומוגנים בבדיקת הורים. מינוי מתחדש מדי שנה עד שתבטלו אותו בהגדרות המינויים של החנות. אנחנו אף פעם לא רואים את פרטי התשלום שלכם.", "pp_t4b": "הרכישות שייכות לחשבון ה-App Store או ה-Google Play שלכם. בכל רכישה המשחק שולח רק מזהה שחקן אנונימי, כדי ש\"שחזור רכישות\" (בהגדרות) יחזיר כל פריט לשחקן הנכון. מטבעות שנקנו נשמרים בגיבוי, לא בחנות. אי אפשר להעביר רכישות בין iPhone ל-Android.", "pp_h5": "5. ילדים.", "pp_t5": "המשחק מיועד לילדים בני 5 ומטה שמשחקים יחד עם מבוגר. אנחנו לא אוספים מידע אישי מילדים.", "pp_h6": "6. מחיקת מידע.", "pp_t6": "כדי להסיר שחקן אחד, השתמשו ב\"הסרה\" במסך \"עריכת שחקן\". כדי למחוק את כל נתוני המשחק, מחקו את האפליקציה או נקו את הנתונים שלה בהגדרות המכשיר.", "pp_h7": "7. מי אנחנו ויצירת קשר.", "pp_t7": "האחראי על האפליקציה (בעל השליטה במידע):", "pp_place": "מקום העסק", "pp_home": "מקום מגורים", "pp_reg": "רישום עסקים", "pp_h8": "8. הזכויות שלכם.", "pp_t8": "אפשר לשאול אותנו כל שאלה על המידע שלכם. מכיוון שאיננו אוספים מידע אישי, לא נשמר אצלנו דבר עליכם. ניתן גם להגיש תלונה לרשות להגנת המידע בסלובקיה (Úrad na ochranu osobných údajov SR). פיקוח על הגנת הצרכן: Slovenská obchodná inšpekcia (SOI)."}};
var NATIVE={"English": "English", "French": "Français", "German": "Deutsch", "Spanish": "Español", "Russian": "Русский", "Ukrainian": "Українська", "Slovak": "Slovenčina", "Polish": "Polski", "Italian": "Italiano", "Chinese": "中文", "Japanese": "日本語", "Hindi": "हिन्दी", "Arabic": "العربية", "Hebrew": "עברית"};
